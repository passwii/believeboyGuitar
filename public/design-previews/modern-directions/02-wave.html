/div><div class="unit">BEATS PER MINUTE <span>·</span> ANDANTE</div></div><div class="toolbar"><button class="step" data-step="-1" aria-label="速度减一拍"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button class="step" data-step="1" aria-label="速度加一拍"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><span class="bpm-label">每分钟 <strong class="bpm-value">92</strong> 拍</span><button class="start" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><span>开始</span></button></div><div class="meter"><span class="meter-label">拍号</span><button type="button" class="" data-meter="3" aria-pressed="false">3/4</button><button type="button" class="selected" data-meter="4" aria-pressed="true">4/4</button><button type="button" class="" data-meter="6" aria-pressed="false">6/8</button></div><div class="beats" aria-label="拍点指示" aria-live="off"><i class="beat"></i><i class="beat"></i><i class="beat"></i><i class="beat"></i></div></section><section class="tab" id="tab"><div class="tab-head"><div><h2>弦上练习</h2><p>C 大调上行练习 · 四小节 · 演示内容</p></div><div class="tabs" role="group" aria-label="选择练习示例"><button class="selected" type="button" aria-pressed="true">五声音阶</button><button type="button" aria-pressed="false">上行练习</button></div></div><figure class="sheet"><figcaption class="sheet-cap"><strong>C 大调上行练习 · 四小节</strong><span>STANDARD TUNING</span></figcaption><div class="tabstaff" role="img" aria-label="六弦吉他 TAB 演示乐句"><div class="tabline"><span class="string-label">e</span><span class="note"><b>0</b></span><span class="rest"></span><span class="note"><b>3</b></span><span class="rest"></span><span class="note"><b>5</b></span><span class="rest"></span><span class="note"><b>3</b></span><span class="rest"></span></div><div class="tabline"><span class="string-label">B</span><span class="note"><b>0</b></span><span class="rest"></span><span class="note"><b>3</b></span><span class="rest"></span><span class="note"><b>5</b></span><span class="rest"></span><span class="note"><b>3</b></span><span class="rest"></span></div><div class="tabline"><span class="string-label">G</span><span class="note"><b>0</b></span><span class="rest"></span><span class="note"><b>2</b></span><span class="rest"></span><span class="note"><b>4</b></span><span class="rest"></span><span class="note"><b>2</b></span><span class="rest"></span></div><div class="tabline"><span class="string-label">D</span><span class="note"><b>0</b></span><span class="rest"></span><span class="note"><b>2</b></span><span class="rest"></span><span class="note"><b>4</b></span><span class="rest"></span><span class="note"><b>2</b></span><span class="rest"></span></div><div class="tabline"><span class="string-label">A</span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span></div><div class="tabline"><span class="string-label">E</span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span><span class="rest"></span></div></div><div class="tab-foot"><span>4 小节 · 4/4</span><span>拖动速度，再按开始</span></div></figure></section></main><footer class="foot">这是可交互的设计原型。曲目、TAB 与速度建议均为虚构演示内容。</footer></div><script>(()=>{let bpm=92,measure=4,beat=0,loop=null,audio=null;const n=document.querySelector('.number'),bpmOut=document.querySelector('.bpm-value'),play=document.querySelector('.start'),beats=document.querySelector('.beats');function update(){n.textContent=bpm;bpmOut.textContent=bpm;if(loop){clearInterval(loop);loop=setInterval(tick,60000/bpm)}}function paintBeats(){beats.innerHTML=Array.from({length:measure},(_,i)=>'<i class="beat" data-beat="'+i+'"></i>').join('');beat=0}function clickSound(accent){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.value=accent?1180:820;gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(accent?.04:.021,audio.currentTime+.004);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.04);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.045)}catch{}}function tick(){const all=[...beats.querySelectorAll('.beat')];all.forEach(x=>x.classList.remove('on'));all[beat]?.classList.add('on');clickSound(beat===0);beat=(beat+1)%all.length}document.querySelectorAll('[data-step]').forEach(x=>x.addEventListener('click',()=>{bpm=Math.max(30,Math.min(240,bpm+Number(x.dataset.step)));update()}));document.querySelectorAll('.meter button').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.meter button').forEach(v=>{const selected=v===x;v.classList.toggle('selected',selected);v.setAttribute('aria-pressed',String(selected))});measure=Number(x.dataset.meter);paintBeats()}));play.addEventListener('click',()=>{if(loop){clearInterval(loop);loop=null;document.body.classList.remove('is-running');play.setAttribute('aria-pressed','false');play.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><span>开始</span>';beats.querySelectorAll('.beat').forEach(x=>x.classList.remove('on'))}else{beat=0;tick();loop=setInterval(tick,60000/bpm);document.body.classList.add('is-running');play.setAttribute('aria-pressed','true');play.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor" stroke="none"/></svg><span>暂停</span>'}});const variants=[["0","–","3","–","5","–","3","–"],["3","–","5","–","7","–","5","–"]];document.querySelectorAll('.tabs button').forEach((x,index)=>x.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(v=>{const selected=v===x;v.classList.toggle('selected',selected);v.setAttribute('aria-pressed',String(selected))});const cells=document.querySelectorAll('.tabline');cells.forEach((line,j)=>{const vals=variants[index];line.querySelectorAll('.note,.rest').forEach((cell,k)=>{cell.className=vals[k]==='–'?'rest':'note';cell.innerHTML=vals[k]==='–'?'':'<b>'+vals[k]+'</b>'})});document.querySelector('.sheet-cap strong').textContent=index?'C 大调上行练习 · 四小节':'A 小调五声音阶 · 四小节'}));document.addEventListener('visibilitychange',()=>{if(document.hidden&&loop){clearInterval(loop);loop=null;document.body.classList.remove('is-running');play.setAttribute('aria-pressed','false');play.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><span>开始</span>'}});update()})();</script></body></html>
