<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉他效果器 · macOS 窗口布局</title>
  <style>
    :root {
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      font-synthesis: none;
      font-variant-numeric: tabular-nums;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    button, select, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible, .choice input:focus-visible + label {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    ::selection { color: var(--blue-ink); background: var(--blue); }
    .preview { width: 100%; margin: 0; }
    .preview-head {
      width: min(100%, 960px);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--foreground);
      font-size: 12px;
    }
    .preview-note { margin-right: auto; color: var(--muted-foreground, var(--foreground)); font-size: 11px; }
    .choices { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #c8c8cc; border-radius: 9px; background: #f4f4f6; }
    .choice input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .choice label { min-height: 28px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 6px; color: #55555a; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .choice input:checked + label { color: #1d1d1f; background: #fff; box-shadow: 0 1px 2px #0002; }
    .preview:has(#theme-dark:checked) .theme-choices .choice input:checked + label,
    .preview:has(#theme-dark:checked) .state-choices .choice input:checked + label { color: #f5f5f7; background: #47474b; }
    .frame { position: relative; container-type: inline-size; width: min(100%, 960px); aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; }
    .app {
      --window: #1c1c1e;
      --group: #27272a;
      --raised: #2c2c30;
      --line: #3c3c40;
      --line-strong: #505055;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --quiet: #85858b;
      --blue: #0a84ff;
      --blue-ink: #071827;
      --green: #30d158;
      --green-soft: #25342a;
      --nam: #e4ad70;
      --ir: #75b8c0;
      --red: #ff453a;
      --meter-track: #3b3b3f;
      --selection: #0a84ff;
      position: absolute;
      inset: 0 auto auto 0;
      width: 960px;
      height: 640px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #4a4a4e;
      border-radius: 14px;
      color: var(--ink);
      background: var(--window);
      color-scheme: dark;
      transform: scale(min(1, calc(100cqw / 960px)));
      transform-origin: top left;
    }
    .preview:has(#theme-light:checked) .app {
      --window: #f5f5f7;
      --group: #fff;
      --raised: #f0f0f2;
      --line: #d8d8dc;
      --line-strong: #b9b9bf;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --quiet: #8e8e93;
      --blue: #0066cc;
      --blue-ink: #fff;
      --green: #1e6a2b;
      --green-soft: #e6f3e8;
      --nam: #8a4c11;
      --ir: #286b73;
      --red: #d70015;
      --meter-track: #dedee2;
      --selection: #007aff;
      border-color: #c8c8cc;
      color-scheme: light;
    }
    .app ::selection { color: var(--blue-ink); background: var(--blue); }
    .mono { font-family: "SFMono-Regular", "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
    .titlebar {
      flex: none;
      height: 46px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    .lights { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px #0002; }
    .lights i:nth-child(1) { background: #ff5f57; }
    .lights i:nth-child(2) { background: #febc2e; }
    .lights i:nth-child(3) { background: #28c840; }
    .app-name { font-size: 13px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--quiet); }
    .status-live { color: var(--ink); }
    .status-live i { background: var(--green); }
    .status-clip { display: none; color: var(--red); }
    .status-clip i { background: var(--red); }
    .separator { width: 1px; height: 18px; flex: none; background: var(--line); }
    .title-spacer { flex: 1; }
    .sample-rate { color: var(--muted); font: 11px "SF Mono", Menlo, monospace; white-space: nowrap; }
    .toolbar-button {
      min-height: 30px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font-size: 12px;
      white-space: nowrap;
      -webkit-app-region: no-drag;
    }
    .toolbar-button:hover { background: var(--raised); }
    .toolbar-button.primary { padding: 0 12px; color: var(--blue-ink); background: var(--blue); font-weight: 600; }
    .toolbar-button.primary:hover { filter: brightness(.94); }
    .toolbar-button.stop { color: var(--ink); background: var(--raised); }
    .listen-start { display: none; }
    .preview:has(#state-idle:checked) .listen-start,
    .preview:has(#state-empty:checked) .listen-start { display: inline-flex; }
    .preview:has(#state-idle:checked) .listen-stop,
    .preview:has(#state-empty:checked) .listen-stop { display: none; }
    .content {
      min-height: 0;
      flex: 1;
      padding: 16px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .routebar {
      flex: none;
      min-height: 62px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 120px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--group);
    }
    .route-cell { min-width: 0; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .route-cell + .route-cell { border-left: 1px solid var(--line); }
    .route-label { color: var(--muted); font-size: 11px; }
    .route-value { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink); font-size: 12px; }
    .route-value span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .route-value svg { width: 12px; height: 12px; flex: none; color: var(--muted); }
    .workspace { min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .workspace-head { flex: none; min-height: 30px; display: flex; align-items: center; gap: 9px; }
    .workspace-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
    .module-count { color: var(--muted); font-size: 11px; }
    .workspace-spacer { flex: 1; }
    .add-button { min-height: 29px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--group); font-size: 11px; }
    .add-button:hover { background: var(--raised); border-color: var(--line-strong); }
    .chain { position: relative; min-height: 0; flex: 1; display: flex; align-items: center; gap: 9px; overflow: hidden; }
    .chain-line { position: absolute; z-index: 0; left: 36px; right: 36px; top: 50%; height: 1px; background: var(--line-strong); }
    .flow { position: absolute; z-index: 1; top: calc(50% - 3px); left: 36px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); opacity: 0; }
    .preview:has(#state-live:checked) .flow { opacity: 1; animation: signal 2.5s linear infinite; }
    .chain-node { position: relative; z-index: 2; min-width: 0; height: 214px; padding: 12px; display: flex; flex-direction: column; gap: 9px; border-radius: 10px; background: var(--group); }
    .io-node { width: 150px; flex: none; background: var(--raised); }
    .module-node { width: 222px; flex: none; }
    .node-head { min-width: 0; display: flex; align-items: center; gap: 7px; }
    .port-icon { width: 18px; height: 18px; flex: none; color: var(--blue); }
    .node-kind { font-size: 12px; font-weight: 600; }
    .node-index { color: var(--quiet); font: 11px "SF Mono", Menlo, monospace; }
    .type-tag { color: var(--nam); font-size: 10px; font-weight: 650; letter-spacing: .02em; }
    .type-tag.ir { color: var(--ir); }
    .module-menu { width: 25px; height: 25px; margin-left: auto; padding: 0; display: grid; place-items: center; border: 0; border-radius: 6px; color: var(--muted); background: transparent; }
    .module-menu:hover { color: var(--ink); background: var(--raised); }
    .module-menu svg { width: 15px; height: 15px; }
    .module-name { min-width: 0; margin: 0; overflow: hidden; font-size: 13px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .file-name { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .module-state { min-height: 14px; color: var(--red); font-size: 10px; }
    .module-state:empty { display: none; }
    .controls { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .control { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .control-head { display: flex; justify-content: space-between; gap: 4px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .control-head b { color: var(--ink); font: 10px "SF Mono", Menlo, monospace; font-weight: 500; }
    input[type="range"] { width: 100%; height: 14px; margin: 0; appearance: none; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 4px; background: var(--line-strong); }
    input[type="range"]::-webkit-slider-thumb { width: 11px; height: 11px; margin-top: -4px; appearance: none; border: 2px solid var(--group); border-radius: 50%; background: var(--blue); }
    input[type="range"]::-moz-range-track { height: 3px; border-radius: 4px; background: var(--line-strong); }
    input[type="range"]::-moz-range-progress { height: 3px; border-radius: 4px; background: var(--blue); }
    input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; border: 2px solid var(--group); border-radius: 50%; background: var(--blue); }
    .reading-label { color: var(--muted); font-size: 11px; }
    .reading { margin-top: 2px; display: flex; align-items: baseline; gap: 4px; }
    .reading strong { font: 19px "SF Mono", Menlo, monospace; letter-spacing: -.04em; }
    .reading small { color: var(--muted); font-size: 10px; }
    .io-meter { height: 5px; margin-top: 4px; overflow: hidden; border-radius: 3px; background: var(--meter-track); }
    .io-meter i { display: block; width: 69%; height: 100%; border-radius: inherit; background: var(--green); }
    .io-meter.output i { width: 62%; }
    .gain-control { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
    .gain-control .control-head { font-size: 11px; }
    .gain-control input { margin-top: 4px; }
    .connector { position: relative; z-index: 2; width: 20px; height: 1px; flex: none; background: var(--line-strong); }
    .empty-chain { display: none; min-height: 0; flex: 1; align-items: center; justify-content: center; gap: 8px; flex-direction: column; }
    .empty-chain svg { width: 22px; height: 22px; color: var(--muted); }
    .empty-chain strong { font-size: 13px; font-weight: 600; }
    .empty-chain span { color: var(--muted); font-size: 11px; }
    .preview:has(#state-empty:checked) .chain { display: none; }
    .preview:has(#state-empty:checked) .empty-chain { display: flex; }
    .preview:has(#state-empty:checked) .module-count { display: none; }
    .preview:has(#state-idle:checked) .status-live,
    .preview:has(#state-empty:checked) .status-live { display: none; }
    .preview:has(#state-idle:checked) .status-idle,
    .preview:has(#state-empty:checked) .status-idle { display: inline-flex; }
    .status-idle { display: none; }
    .preview:has(#state-clip:checked) .status-live,
    .preview:has(#state-clip:checked) .status-idle { display: none; }
    .preview:has(#state-clip:checked) .status-clip { display: inline-flex; }
    .preview:has(#state-idle:checked) .flow,
    .preview:has(#state-empty:checked) .flow,
    .preview:has(#state-clip:checked) .flow { display: none; }
    .reading-idle, .reading-clip { display: none; }
    .preview:has(#state-idle:checked) .reading-live,
    .preview:has(#state-empty:checked) .reading-live { display: none; }
    .preview:has(#state-idle:checked) .reading-idle,
    .preview:has(#state-empty:checked) .reading-idle { display: inline; }
    .preview:has(#state-clip:checked) .reading-live { display: none; }
    .preview:has(#state-clip:checked) .reading-clip { display: inline; color: var(--red); }
    .preview:has(#state-clip:checked) .input-meter i { width: 100%; background: var(--red); }
    .preview:has(#state-clip:checked) .input-node .reading-label { color: var(--red); }
    .preview:has(#state-idle:checked) .io-meter i,
    .preview:has(#state-empty:checked) .io-meter i { width: 0; }
    @keyframes signal { from { transform: translateX(0); } to { transform: translateX(850px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
    @media (max-width: 740px) { .preview-note { display: none; } .choices { max-width: 100%; } .choice label { padding: 0 7px; } }
  </style>
</head>
<body>
  <main class="preview" aria-label="吉他效果器界面草稿">
    <header class="preview-head">
      <span class="preview-note">macOS 原生标题区布局 · 设备与读数为示意</span>
      <div class="choices theme-choices" role="radiogroup" aria-label="主题预览">
        <span class="choice"><input type="radio" name="theme" id="theme-dark" checked><label for="theme-dark">暗色</label></span>
        <span class="choice"><input type="radio" name="theme" id="theme-light"><label for="theme-light">浅色</label></span>
      </div>
      <div class="choices state-choices" role="radiogroup" aria-label="界面状态预览">
        <span class="choice"><input type="radio" name="state" id="state-live" checked><label for="state-live">监听</label></span>
        <span class="choice"><input type="radio" name="state" id="state-idle"><label for="state-idle">待机</label></span>
        <span class="choice"><input type="radio" name="state" id="state-empty"><label for="state-empty">空链路</label></span>
        <span class="choice"><input type="radio" name="state" id="state-clip"><label for="state-clip">削波</label></span>
      </div>
    </header>
    <div class="frame">
      <section class="app" aria-label="吉他效果器 macOS 桌面窗口示意">
        <header class="titlebar">
          <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="app-name">吉他效果器</span>
          <span class="separator" aria-hidden="true"></span>
          <span class="status status-live"><i></i>监听中</span>
          <span class="status status-idle"><i></i>已停止</span>
          <span class="status status-clip"><i></i>输入削波</span>
          <span class="sample-rate">48 kHz</span>
          <span class="title-spacer"></span>
          <button class="toolbar-button" type="button" aria-label="打开预设">打开</button>
          <button class="toolbar-button" type="button" aria-label="保存预设">保存</button>
          <button class="toolbar-button primary listen-start" type="button">开始监听</button>
          <button class="toolbar-button primary stop listen-stop" type="button">停止监听</button>
        </header>
        <div class="content">
          <section class="routebar" aria-label="音频设备路由">
            <div class="route-cell"><span class="route-label">吉他输入</span><div class="route-value"><span>USB 音频接口</span><svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div></div>
            <div class="route-cell"><span class="route-label">输入通道</span><div class="route-value"><span>输入 1</span><svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div></div>
            <div class="route-cell"><span class="route-label">耳机输出</span><div class="route-value"><span>内建输出</span><svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div></div>
            <div class="route-cell"><span class="route-label">缓冲</span><div class="route-value"><span>128 样本</span><svg viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div></div>
          </section>
          <section class="workspace" aria-label="效果链编辑区">
            <header class="workspace-head">
              <h2>效果链</h2><span class="module-count">2 个模块</span><span class="workspace-spacer"></span>
              <button class="add-button" type="button">+ NAM</button>
              <button class="add-button" type="button">+ IR</button>
            </header>
            <div class="chain">
              <div class="chain-line" aria-hidden="true"></div><i class="flow" aria-hidden="true"></i>
              <article class="chain-node io-node input-node">
                <div class="node-head"><svg class="port-icon" viewBox="0 0 20 20" fill="none"><path d="M2 10h4l2-5 3.2 10 2.2-7 1.6 2H18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="node-kind">输入</span></div>
                <div><div class="reading-label">输入电平</div><div class="reading mono"><strong><span class="reading-live">−18.4</span><span class="reading-idle">−120.0</span><span class="reading-clip">+0.0</span></strong><small>dBFS</small></div><div class="io-meter input-meter"><i></i></div></div>
                <div class="gain-control"><div class="control-head"><span>输入增益</span><b>+0.0 dB</b></div><input type="range" min="-24" max="24" value="0" aria-label="全局输入增益"></div>
              </article>
              <div class="connector" aria-hidden="true"></div>
              <article class="chain-node module-node">
                <div class="node-head"><span class="node-index">01</span><span class="type-tag">NAM</span><button class="module-menu" type="button" aria-label="NAM 模块操作"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.25"/><circle cx="8" cy="8" r="1.25"/><circle cx="13" cy="8" r="1.25"/></svg></button></div>
                <div><h3 class="module-name">英式清音</h3><div class="file-name">示例模型.nam</div></div>
                <div class="module-state"></div>
                <div class="controls">
                  <label class="control"><span class="control-head"><span>入</span><b>0.0</b></span><input type="range" min="-24" max="24" value="0" aria-label="NAM 输入增益"></label>
                  <label class="control"><span class="control-head"><span>出</span><b>0.0</b></span><input type="range" min="-24" max="24" value="0" aria-label="NAM 输出增益"></label>
                  <label class="control"><span class="control-head"><span>混</span><b>100%</b></span><input type="range" min="0" max="100" value="100" aria-label="NAM 混合比例"></label>
                </div>
              </article>
              <div class="connector" aria-hidden="true"></div>
              <article class="chain-node module-node">
                <div class="node-head"><span class="node-index">02</span><span class="type-tag ir">IR</span><button class="module-menu" type="button" aria-label="IR 模块操作"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.25"/><circle cx="8" cy="8" r="1.25"/><circle cx="13" cy="8" r="1.25"/></svg></button></div>
                <div><h3 class="module-name">开放式 2×12 箱体</h3><div class="file-name">示例箱体.wav</div></div>
                <div class="module-state"></div>
                <div class="controls">
                  <label class="control"><span class="control-head"><span>入</span><b>0.0</b></span><input type="range" min="-24" max="24" value="0" aria-label="IR 输入增益"></label>
                  <label class="control"><span class="control-head"><span>出</span><b>0.0</b></span><input type="range" min="-24" max="24" value="0" aria-label="IR 输出增益"></label>
                  <label class="control"><span class="control-head"><span>混</span><b>100%</b></span><input type="range" min="0" max="100" value="100" aria-label="IR 混合比例"></label>
                </div>
              </article>
              <div class="connector" aria-hidden="true"></div>
              <article class="chain-node io-node output-node">
                <div class="node-head"><svg class="port-icon" viewBox="0 0 20 20" fill="none"><path d="M2 10h5m4 0h7M7 7l3 3-3 3m4-6 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="node-kind">输出</span></div>
                <div><div class="reading-label">输出电平</div><div class="reading mono"><strong><span class="reading-live">−21.0</span><span class="reading-idle">−120.0</span></strong><small>dBFS</small></div><div class="io-meter output"><i></i></div></div>
                <div class="gain-control"><div class="control-head"><span>主输出</span><b>−6.0 dB</b></div><input type="range" min="-24" max="24" value="-6" aria-label="主输出增益"></div>
              </article>
            </div>
            <div class="empty-chain"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12h5m8 0h5M8 8l4 4-4 4m8-8 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><strong>效果链为空</strong><span>使用上方 + NAM 或 + IR 开始</span></div>
          </section>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
