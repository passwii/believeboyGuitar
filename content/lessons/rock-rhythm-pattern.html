<article>
  <lesson-widget name="rock-rhythm-tab-drill"></lesson-widget>

  <details class="lesson-focus__notes">
    <summary>练习说明</summary>
    <h2>练习方法</h2>
    <p>
      曲谱为 4/4、♩=160，调式标记 <strong>1=F</strong>。先降速练习右手的开放音与掌根制音，再按 D5、Bb5、F5、C5 的和弦标记切换把位。
    </p>
    <p>
      <strong>P.M.</strong> 表示掌根制音，横向虚线表示覆盖范围；<strong>开 / 闷</strong> 是原谱的触弦提示。TAB 一弦在最上方，数字表示品位。
    </p>

    <h2>技巧记号</h2>
    <ul>
      <li><strong>/</strong>：滑入当前品位。</li>
      <li><strong>X</strong>：闷音。</li>
      <li><strong>~</strong>：延音；波纹线表示揉弦。</li>
    </ul>

    <h2>核对</h2>
    <p>
      请对照原图核对弦号与品位，尤其是第 11 小节的滑入、闷音与延音位置。低清截图中无法完全确定的细节应以原谱为准。
    </p>
  </details>
</article>
